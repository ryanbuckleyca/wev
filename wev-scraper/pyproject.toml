[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "wev-scraper"
version = "0.1.0"
description = "Job scraper and processing engine for the WEV project"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "python-dotenv",
  "supabase",
  "requests",
  "playwright",
  "playwright-stealth",
  "python-dateutil",
  "geocodio-library-python",
  "google-genai",
]

[tool.setuptools]
packages = ["lib", "utils", "scrapers", "llm"]
package-dir = { "" = "." }

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["B", "D3", "E", "F", "I"]
ignore = ["E501"]
