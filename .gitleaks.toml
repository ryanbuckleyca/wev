# Gitleaks configuration
# [extend] is required: a custom config replaces the default rule set unless
# we inherit it. Without useDefault, this file would only apply the allowlist.

title = "wev"

[extend]
useDefault = true

# Default gitleaks 8.29 does not ship sb_secret_ (new Supabase admin keys).
[[rules]]
id = "supabase-secret-key"
description = "Supabase secret key"
regex = '''sb_secret_[a-zA-Z0-9_-]{31}'''
keywords = ["sb_secret_"]

# Groq inference keys (gsk_ + 48 alphanumerics). Not in gitleaks 8.29.
[[rules]]
id = "groq-api-key"
description = "Groq API key"
regex = '''gsk_[a-zA-Z0-9]{48}'''
entropy = 4.0
keywords = ["gsk_"]

[allowlist]
description = "Allowlisted files and patterns"

# Test files with dummy/fake passwords used in unit and e2e tests
paths = [
  '''e2e/tests/auth/signup\.spec\.ts''',
  '''e2e/tests/auth-email\.spec\.ts''',
  '''e2e/tests/mutating/matching\.spec\.ts''',
  '''wev-bulletin/lib/password-strength\.test\.ts''',
  '''wev-bulletin/lib/account/password-verifier\.test\.ts''',
  '''wev-bulletin/app/api/account/route\.test\.ts''',
  '''wev-bulletin/app/\[locale\]/account-settings/page\.test\.tsx''',
  '''lib/password-strength\.test\.ts''',
]
