# This file controls the behavior of Trunk: https://docs.trunk.io/cli
# To learn more about the format of this file, see https://docs.trunk.io/reference/trunk-yaml
version: 0.1
cli:
  version: 1.25.0
# Trunk provides extensibility via plugins. (https://docs.trunk.io/plugins)
plugins:
  sources:
    - id: trunk
      ref: v1.7.6
      uri: https://github.com/trunk-io/plugins
# Many linters and tools depend on runtimes - configure them here. (https://docs.trunk.io/runtimes)
runtimes:
  enabled:
    - go@1.21.0
    - node@22.16.0
    - python@3.10.8
# This is the section where you manage your linters. (https://docs.trunk.io/check/configuration)
lint:
  ignore:
    - linters: [eslint]
      paths:
        - wev-bulletin/next.config.mjs
        - wev-bulletin/eslint.config.mjs
        - eslint.config.mjs
        - wev-bulletin/**/*.js
    - linters: [sqlfluff]
      paths:
        - supabase/migrations/**
        - supabase/tests/**
        - supabase/checks/**
    - linters: [bandit, pyright, checkov, hadolint, markdownlint]
      paths:
        - wev-scraper/**
        - supabase/apply-migrations-direct.py
    - linters: [eslint]
      paths:
        - scripts/**
  disabled:
    - black
    - isort
    - checkov
    - markdownlint
    - osv-scanner
    - trufflehog
    - yamllint
  enabled:
    - sqlfluff@3.3.1
    - actionlint@1.7.12
    - bandit@1.9.4
    - git-diff-check
    - hadolint@2.14.0
    - prettier@3.8.3
    - ruff@0.15.11
    - shellcheck@0.11.0
    - shfmt@3.6.0
    - taplo@0.10.0
    - eslint@9.39.4
    - pyright@1.1.409
actions:
  disabled:
    - trunk-announce
    - trunk-check-pre-push
    - trunk-fmt-pre-commit
  enabled:
    - trunk-upgrade-available
