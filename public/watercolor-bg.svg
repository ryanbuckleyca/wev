<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Purple gradient (lavender tint) -->
    <radialGradient id="purpleGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0e4ec" stop-opacity="0.33"/>
      <stop offset="16%" stop-color="#f0e4ec" stop-opacity="0.33"/>
      <stop offset="38%" stop-color="#f0e4ec" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Teal gradient (teal tint) -->
    <radialGradient id="tealGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D6EAEA" stop-opacity="0.3"/>
      <stop offset="17%" stop-color="#D6EAEA" stop-opacity="0.3"/>
      <stop offset="39%" stop-color="#D6EAEA" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Blue gradient (blue tint) -->
    <radialGradient id="blueGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#C3D9EB" stop-opacity="0.25"/>
      <stop offset="8%" stop-color="#C3D9EB" stop-opacity="0.25"/>
      <stop offset="22%" stop-color="#C3D9EB" stop-opacity="0"/>
    </radialGradient>
  </defs>
  
  <!-- Circles -->
  <circle cx="8" cy="20" r="133" fill="url(#purpleGrad)" opacity="0.6"/>
  <circle cx="92" cy="18" r="133" fill="url(#purpleGrad)" opacity="0.6"/>
  <circle cx="32" cy="85" r="137" fill="url(#tealGrad)" opacity="0.6"/>
  <circle cx="68" cy="48" r="133" fill="url(#purpleGrad)" opacity="0.6"/>
  <circle cx="16" cy="92" r="77" fill="url(#blueGrad)" opacity="0.6"/>
  <circle cx="55" cy="32" r="137" fill="url(#tealGrad)" opacity="0.6"/>
  <circle cx="88" cy="80" r="133" fill="url(#purpleGrad)" opacity="0.6"/>
</svg>
