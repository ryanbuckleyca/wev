name: ESLint

on:
  push:
    paths:
      - 'wev-bulletin/**'
  pull_request:
    paths:
      - 'wev-bulletin/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run lint --prefix wev-bulletin