name: ESLint

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'wev-bulletin/**'
      - 'wev-scraper/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  pull_request:
    paths:
      - 'wev-bulletin/**'
      - 'wev-scraper/**'
      - 'supabase/**'
      - '.github/workflows/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python linting tools
        run: pip install ruff pyright
      - name: Run monorepo linting
        run: npm run lint