name: ESLint

on:
  push:
    branches:
      - main
      - production
    paths:
      - 'wev-bulletin/**'
      - 'wev-scraper/**'
      - 'supabase/**'
  pull_request:
    paths:
      - 'wev-bulletin/**'
      - 'wev-scraper/**'
      - 'supabase/**'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Run monorepo linting
        run: npm run lint