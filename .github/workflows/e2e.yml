name: E2E Tests

on:
  push:
    branches:
      - main
      - production
    paths:
      - "e2e/**"
      - "wev-bulletin/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed/**"
      - "supabase/src/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "package-lock.json"
  pull_request:
    branches:
      - main
      - production
    paths:
      - "e2e/**"
      - "wev-bulletin/**"
      - "supabase/config.toml"
      - "supabase/migrations/**"
      - "supabase/seed/**"
      - "supabase/src/**"
      - ".github/workflows/e2e.yml"
      - "package.json"
      - "package-lock.json"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Cache Playwright binaries
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json', 'e2e/package.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Cache Next.js build
        uses: actions/cache@v4
        id: nextjs-cache
        with:
          path: wev-bulletin/.next/cache
          # Hash all build-time inputs for wev-bulletin, plus shared Supabase modules
          # pulled in through the bulletin tsconfig path aliases.
          key: >-
            ${{ runner.os }}-nextjs-${{ hashFiles(
              'package-lock.json',
              'package.json',
              'wev-bulletin/package.json',
              'wev-bulletin/next.config.mjs',
              'wev-bulletin/tsconfig.json',
              'wev-bulletin/postcss.config.js',
              'wev-bulletin/tailwind.config.js',
              'wev-bulletin/middleware.ts',
              'wev-bulletin/app/**',
              'wev-bulletin/components/**',
              'wev-bulletin/contexts/**',
              'wev-bulletin/hooks/**',
              'wev-bulletin/i18n/**',
              'wev-bulletin/lib/**',
              'wev-bulletin/messages/**',
              'supabase/src/**'
            ) }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('package-lock.json') }}-

      - name: Report cache status
        run: |
          echo "Playwright cache hit: ${{ steps.playwright-cache.outputs.cache-hit || 'false' }}"
          echo "Next.js cache hit: ${{ steps.nextjs-cache.outputs.cache-hit || 'false' }}"

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase and export env vars
        # Use the CLI installed by npm ci so workflow behavior stays stable
        # when Supabase publishes new versions.
        # Output the env format directly to a file, source it natively in bash
        # so there's no brittle grep/awk parsing, and then map the generic CLI
        # variables to our Next.js-specific names in $GITHUB_ENV.
        run: |
          ./node_modules/.bin/supabase start --yes --exclude studio,edge-runtime,logflare,vector
          ./node_modules/.bin/supabase status -o env > supabase.env

          # Native bash parsing of the key-value pairs
          source supabase.env

          # Enforce fallbacks in case something goes wildly wrong
          API_URL="${API_URL}"

          echo "SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> $GITHUB_ENV
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> $GITHUB_ENV
          echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$ANON_KEY" >> $GITHUB_ENV

      - name: Create .env placeholder for dotenv-cli
        # dotenv -e .env (used in `npm run build`) requires the file to exist.
        # Values are already in the environment — dotenv-cli won't override them.
        run: touch .env

      - name: Build Next.js app
        env:
          # Hard fallbacks ensure vars are never empty even if awk parsing fails.
          # SUPABASE_URL and NEXT_PUBLIC_SUPABASE_URL are always 127.0.0.1:54321.
          SUPABASE_URL: ${{ env.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ env.SUPABASE_SERVICE_ROLE_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ env.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          REVALIDATE_SECRET: dummy-e2e-cache-secret
        run: npm run build

      - name: Install Playwright system dependencies
        run: npx playwright install-deps chromium
        working-directory: e2e

      - name: Install Playwright browser
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install chromium
        working-directory: e2e

      - name: Run E2E tests
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          REVALIDATE_SECRET: dummy-e2e-cache-secret
          CI: true
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 14
