name: Coverage Guidelines Report

on:
  push:
    branches:
      - main
      - production
    paths:
      - "wev-bulletin/**"
      - "wev-scraper/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "TESTING.md"
      - ".github/workflows/coverage-guidelines.yml"
  pull_request:
    branches:
      - main
      - production
    paths:
      - "wev-bulletin/**"
      - "wev-scraper/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - "TESTING.md"
      - ".github/workflows/coverage-guidelines.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage_guidelines:
    name: Coverage report (non-blocking)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Setup Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"

      - name: Install Node dependencies
        run: npm ci

      - name: Install scraper test deps
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-mock pytest-cov hypothesis
        working-directory: wev-scraper

      - name: Cache Playwright browsers
        uses: actions/cache@1bd1e32a3bdc45362d1e726936510720a7c30a57 # v4.2.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-ms-playwright-${{ hashFiles('wev-scraper/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-ms-playwright-

      - name: Install Playwright browser (scraper tests)
        run: |
          python3 -m playwright install --with-deps chromium
        working-directory: wev-scraper

      - name: Coverage guidelines report
        env:
          SUPABASE_URL: "https://test.supabase.co"
          SUPABASE_SECRET_KEY: "test-secret-key"
          NEXT_PUBLIC_SUPABASE_URL: "https://test.supabase.co"
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "test-key"
        run: npm run coverage:guidelines
