name: DB Tests

on:
  push:
    branches:
      - main
      - production
    paths:
      - '.github/workflows/db-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  pull_request:
    branches:
      - main
      - production
    paths:
      - '.github/workflows/db-tests.yml'
      - 'package.json'
      - 'package-lock.json'
      - 'supabase/config.toml'
      - 'supabase/migrations/**'
      - 'supabase/tests/**'
  workflow_dispatch:

jobs:
  db-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase
        run: ./node_modules/.bin/supabase start --yes

      - name: Run DB tests
        run: npm run test:db
