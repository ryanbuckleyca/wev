name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify environment variables (for build)
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_ROLE_KEY" ]; then
            echo "⚠ WARNING: SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY not set"
            echo "Build may still succeed; set them in Northflank for runtime"
          else
            echo "✓ Supabase server env vars are set"
          fi

      - name: Build Next.js app
        env:
          # Server-only; not exposed to client. Use placeholders if missing so CI build succeeds.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || 'placeholder-service-role-key' }}
        run: npm run build

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Build summary
        run: |
          echo "✓ Build completed successfully"
          echo "Ready for deployment to Northflank"
          echo ""
          echo "Remember to set these environment variables in Northflank:"
          echo "  - SUPABASE_URL (server-only)"
          echo "  - SUPABASE_SERVICE_ROLE_KEY (server-only, never )"
          echo "  - GITHUB_TOKEN (for API routes)"
          echo "  - GITHUB_REPO_OWNER"
          echo "  - GITHUB_REPO_NAME"
          echo "  - GITHUB_WORKFLOW_ID (optional)"
