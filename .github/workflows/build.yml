name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Next.js app
        env:
          # Server-only; not exposed to client. Use placeholders if missing so CI build succeeds.
          SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder.supabase.co' }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY || 'placeholder-service-role-key' }}
          # Client-side variables needed for middleware and build
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_KEY || 'placeholder-publishable-key' }}
          NEXT_PUBLIC_SITE_URL: ${{ secrets.NEXT_PUBLIC_SITE_URL || 'https://bulletin.wevchange.org' }}
        run: npm run build

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Build summary
        run: |
          echo "✓ Build completed successfully"
          echo "Ready for deployment to Northflank"
          echo ""
          echo "Remember to set these environment variables in Northflank:"
          echo "  - SUPABASE_URL (server-only)"
          echo "  - SUPABASE_SERVICE_ROLE_KEY (server-only, never expose)"
          echo "  - NEXT_PUBLIC_SITE_URL (for auth redirects, e.g. https://bulletin.wevchange.org)"
          echo "  - WEV_GITHUB_TOKEN (for API routes)"

  e2e_perf:
    runs-on: ubuntu-latest
    needs: build
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare Playwright perf environment
        id: perf_env
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || secrets.NEXT_PUBLIC_SUPABASE_KEY }}
        run: |
          missing=0
          for name in SUPABASE_URL SUPABASE_SERVICE_ROLE_KEY NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY; do
            if [ -z "${!name}" ]; then
              echo "Missing required perf secret: ${name}"
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "run_perf=false" >> "$GITHUB_OUTPUT"
            echo "Skipping Playwright perf checks because the wev-test secrets are not configured."
            exit 0
          fi

          SUPABASE_PROJECT_REF="${SUPABASE_URL#*://}"
          SUPABASE_PROJECT_REF="${SUPABASE_PROJECT_REF%%.*}"

          cat > .env <<EOF
          SUPABASE_PROJECT_REF=${SUPABASE_PROJECT_REF}
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
          NEXT_PUBLIC_SUPABASE_URL=${NEXT_PUBLIC_SUPABASE_URL}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY}
          NEXT_PUBLIC_SITE_URL=http://127.0.0.1:3001
          EOF

          echo "run_perf=true" >> "$GITHUB_OUTPUT"

      - name: Install Playwright browser
        if: steps.perf_env.outputs.run_perf == 'true'
        run: npx playwright install --with-deps chromium

      - name: Validate Supabase URL/key pair
        if: steps.perf_env.outputs.run_perf == 'true'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY || secrets.SUPABASE_SECRET_KEY }}
        run: |
          set -euo pipefail

          status="$(curl -s -o /tmp/supabase_preflight_response.txt -w '%{http_code}' \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_SERVICE_ROLE_KEY}" \
            "${SUPABASE_URL}/rest/v1/sources?select=id&limit=1")"

          if [ "${status}" -ge 400 ]; then
            echo "Supabase auth preflight failed (HTTP ${status})."
            echo "Check SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY in GitHub Secrets."
            exit 1
          fi

          echo "Supabase auth preflight passed (HTTP ${status})."

      - name: Run Playwright perf checks
        if: steps.perf_env.outputs.run_perf == 'true'
        run: npm run test:e2e:perf -- --project=chromium

      - name: Upload Playwright perf artifacts
        if: ${{ always() && steps.perf_env.outputs.run_perf == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-perf-artifacts
          path: |
            playwright-report
            e2e/.output
            e2e/results
          if-no-files-found: ignore
