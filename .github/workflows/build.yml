name: Build and Test

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify environment variables (for build)
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SUPABASE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_KEY }}
        run: |
          if [ -z "$NEXT_PUBLIC_SUPABASE_URL" ]; then
            echo "⚠ WARNING: NEXT_PUBLIC_SUPABASE_URL not set in GitHub secrets"
            echo "This is okay for CI - set it in Northflank environment variables"
          else
            echo "✓ NEXT_PUBLIC_SUPABASE_URL is set"
          fi
          if [ -z "$NEXT_PUBLIC_SUPABASE_ANON_KEY" ] && [ -z "$NEXT_PUBLIC_SUPABASE_KEY" ]; then
            echo "⚠ WARNING: Supabase key not set in GitHub secrets"
            echo "This is okay for CI - set it in Northflank environment variables"
          else
            echo "✓ Supabase key is set"
          fi

      - name: Build Next.js app
        env:
          # These will be available in Northflank at runtime
          # For build, use secrets if available, otherwise build will use placeholders
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY || secrets.NEXT_PUBLIC_SUPABASE_KEY || 'placeholder-key' }}
        run: npm run build

      - name: Run linting
        run: npm run lint
        continue-on-error: true

      - name: Build summary
        run: |
          echo "✓ Build completed successfully"
          echo "Ready for deployment to Northflank"
          echo ""
          echo "Remember to set these environment variables in Northflank:"
          echo "  - NEXT_PUBLIC_SUPABASE_URL"
          echo "  - NEXT_PUBLIC_SUPABASE_ANON_KEY (or NEXT_PUBLIC_SUPABASE_KEY)"
          echo "  - GITHUB_TOKEN (for API routes)"
          echo "  - GITHUB_REPO_OWNER"
          echo "  - GITHUB_REPO_NAME"
          echo "  - GITHUB_WORKFLOW_ID (optional)"
